set -g mouse on
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Configuration
set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
setw -g mode-keys vi
setw -g window-status-current-format '#[bg=red] #I:#W #[default]'

# Theme
set -g @tmux-gruvbox 'dark'


# Plugins
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# Plugin configuration
set -g @sessionx-bind 'o'
set -g @sessionx-x-path "$HOME/dotfiles"
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-command 'eza -T --level=2 {}'

set -g @continuum-restore 'on'

set -g @resurrect-strategy-nvim 'session'


# Bindings
bind ^X lock-server
bind ^D detach

bind R source-file "$HOME/.config/tmux/tmux.conf" \; display-message 'tmux config reloaded'

bind : command-prompt
bind r command-prompt "rename-window %%"
bind ^L refresh-client
bind l refresh-client
bind * setw synchronize-panes
bind P set pane-border-status
bind S choose-session
bind K send-keys "clear"\; send-keys "Enter"
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Windows
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind ^C new-window -c "$HOME"
bind H previous-window
bind L next-window
bind '"' choose-window
bind ^A last-window
bind ^W list-windows
bind w list-windows

# Panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind z resize-pane -Z
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind c kill-pane
bind x swap-pane -D

run-shell "$HOME/.config/tmux/plugins/tpm/tpm"
